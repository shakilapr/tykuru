name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build
        run: pnpm build
      - name: Frontend dependency audit
        # Dev-only advisories (vite/vitest/esbuild) are tracked as follow-ups;
        # reported but non-blocking until they are remediated, so CI stays green.
        continue-on-error: true
        run: pnpm audit
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux system dependencies
        # The backend links against GTK/WebKit (wry/tao); these system libraries
        # are required to compile clippy/test on the Ubuntu runner even though
        # the app targets Windows. Official Tauri 2 Debian/Ubuntu dependency set.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust unit tests
        # `--lib` only: the integration tests (tests/compiler.rs) drive the real
        # Typst sidecar, which is Windows-only and not present on this runner.
        # They run in the `typst-fixtures`/`windows-e2e` jobs instead.
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  # Real-Typst compatibility gate (architecture §24.3): compile every fully
  # local fixture against the pinned official Typst sidecar and assert the
  # %PDF- signature / expected failure for the `errors` fixture. Runs on
  # Windows because the pinned sidecar is the Windows release binary.
  typst-fixtures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify pinned Typst binary
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_typst.ps1
      - name: Verify fixtures against real Typst
        run: pnpm typst:fixtures
      - name: Rust integration tests (real sidecar)
        # The sidecar is present here, so the Windows-gated compiler integration
        # tests (tests/compiler.rs) can run.
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-e2e:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify pinned Typst binary
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_typst.ps1
      - name: Build NSIS installer + release binary
        # windows-latest ships Visual C++ Build Tools (MSVC link.exe), so the
        # release link that fails on the mingw-only dev machine works here.
        run: pnpm build:windows
      - name: Run desktop E2E against the built app
        run: |
          npx playwright install chromium
          pnpm test:e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-artifacts
          path: |
            src-tauri/target/release/tykuru.exe
            playwright-report/
            test-results/
            src-tauri/target/release/bundle/nsis/*.sha256
          retention-days: 7
          if-no-files-found: ignore
