[package]
name = "tykuru"
version = "0.1.0"
description = "Local-first Windows desktop app for previewing and editing Typst documents"
authors = ["Tykuru contributors"]
license = "GPL-3.0"
edition = "2021"

# The _lib target is what Tauri builds; main.rs just calls run().
[lib]
name = "tykuru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
notify = "6"
tokio-util = "0.7"
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
